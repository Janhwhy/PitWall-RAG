<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="redbull-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#060e20" />
    </linearGradient>
    <linearGradient id="skin-max" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae3d9" />
      <stop offset="100%" stop-color="#e8b49b" />
    </linearGradient>
  </defs>

  <!-- Shoulders & Upper Body Suit -->
  <path d="M 20,360 L 35,250 C 45,200 100,185 150,185 C 200,185 255,200 265,250 L 280,360 Z" fill="url(#redbull-navy)" />

  <!-- Red Bull Yellow/Red Stripes -->
  <path d="M 40,255 L 140,220 L 140,360" fill="none" stroke="#f59e0b" stroke-width="5" />
  <path d="M 260,255 L 160,220 L 160,360" fill="none" stroke="#dc2626" stroke-width="5" />

  <!-- Red Bull Charging Bull Emblem -->
  <circle cx="150" cy="250" r="16" fill="#f59e0b" />
  <path d="M 138,252 C 145,244 155,244 162,252" stroke="#dc2626" stroke-width="4" fill="none" />

  <!-- Neck -->
  <rect x="132" y="135" width="36" height="45" rx="6" fill="url(#skin-max)" />

  <!-- Face Contour -->
  <path d="M 110,100 C 110,50 190,50 190,100 C 190,145 174,160 150,160 C 126,160 110,145 110,100 Z" fill="url(#skin-max)" />

  <!-- Verstappen Short Blonde/Light Brown Hair -->
  <path d="M 106,95 C 102,45 125,28 150,28 C 175,28 198,45 194,95 C 184,55 168,36 150,36 C 132,36 116,55 106,95 Z" fill="#b48348" />

  <!-- Eyebrows & Eyes -->
  <path d="M 124,90 Q 134,84 142,88 M 158,88 Q 166,84 176,90" stroke="#785028" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="134" cy="97" r="4" fill="#3b5998" />
  <circle cx="166" cy="97" r="4" fill="#3b5998" />

  <!-- Nose & Mouth -->
  <path d="M 150,95 L 146,112 L 154,112 Z" fill="#e8b49b" opacity="0.8" />
  <path d="M 136,128 Q 150,134 164,128" stroke="#a86b4c" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>