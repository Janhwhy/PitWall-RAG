<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="ferrari-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="skin-hamilton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a5629" />
      <stop offset="100%" stop-color="#543316" />
    </linearGradient>
  </defs>

  <!-- Shoulders & Upper Body Suit -->
  <path d="M 20,360 L 35,250 C 45,200 100,185 150,185 C 200,185 255,200 265,250 L 280,360 Z" fill="url(#ferrari-red)" />

  <!-- Collar & Zipper -->
  <path d="M 110,190 L 150,225 L 190,190 L 175,172 L 125,172 Z" fill="#990000" />
  <line x1="150" y1="225" x2="150" y2="360" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Suit Chest Stripes & Sponsors -->
  <path d="M 50,250 Q 150,220 250,250" fill="none" stroke="#ffffff" stroke-width="4" />
  <!-- Shell yellow logo badge -->
  <path d="M 70,270 L 90,260 L 105,275 L 95,295 L 75,290 Z" fill="#ffcc00" stroke="#d32f2f" stroke-width="1.5" />
  <!-- HP Logo badge -->
  <circle cx="215" cy="275" r="15" fill="#0055a5" />
  <text x="215" y="281" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">hp</text>

  <!-- Neck -->
  <rect x="130" y="135" width="40" height="45" rx="6" fill="url(#skin-hamilton)" />

  <!-- Face Contour -->
  <path d="M 108,100 C 108,50 192,50 192,100 C 192,145 174,160 150,160 C 126,160 108,145 108,100 Z" fill="url(#skin-hamilton)" />

  <!-- Hair Braids -->
  <path d="M 106,95 C 102,55 125,32 150,32 C 175,32 198,55 194,95 C 185,65 168,46 150,46 C 132,46 115,65 106,95 Z" fill="#120a04" />
  <path d="M 118,44 Q 128,75 120,108 M 134,38 Q 144,75 136,114 M 150,36 Q 150,75 150,116 M 166,38 Q 156,75 164,114 M 182,44 Q 172,75 180,108" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

  <!-- Beard & Mustache -->
  <path d="M 122,122 C 122,154 178,154 178,122 C 178,162 122,162 122,122 Z" fill="#120a04" opacity="0.88" />
  <path d="M 132,126 Q 150,132 168,126" stroke="#120a04" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Glasses / Sunglasses style or Sharp Eyes -->
  <path d="M 124,90 Q 136,85 144,91 M 156,91 Q 164,85 176,90" stroke="#120a04" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="134" cy="98" r="4" fill="#261408" />
  <circle cx="166" cy="98" r="4" fill="#261408" />

  <!-- Nose -->
  <path d="M 150,96 L 146,112 L 154,112 Z" fill="#543316" opacity="0.7" />
</svg>