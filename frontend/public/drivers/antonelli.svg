<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="merc-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="skin-antonelli" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="100%" stop-color="#d4a373" />
    </linearGradient>
  </defs>

  <!-- Shoulders & Upper Body Suit -->
  <path d="M 20,360 L 35,250 C 45,200 100,185 150,185 C 200,185 255,200 265,250 L 280,360 Z" fill="url(#merc-dark)" />

  <!-- Petronas Teal Accent Lines -->
  <path d="M 40,260 L 130,220 L 130,360" fill="none" stroke="#00a19c" stroke-width="6" stroke-linecap="round" />
  <path d="M 260,260 L 170,220 L 170,360" fill="none" stroke="#00a19c" stroke-width="6" stroke-linecap="round" />

  <!-- Mercedes Three pointed star badge on chest -->
  <circle cx="150" cy="250" r="16" fill="#000000" stroke="#e5e7eb" stroke-width="2" />
  <path d="M 150,236 L 150,250 M 150,250 L 138,258 M 150,250 L 162,258" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="132" y="135" width="36" height="45" rx="6" fill="url(#skin-antonelli)" />

  <!-- Face Contour -->
  <path d="M 112,100 C 112,50 188,50 188,100 C 188,145 172,158 150,158 C 128,158 112,145 112,100 Z" fill="url(#skin-antonelli)" />

  <!-- Antonelli Curly Dark Brown Hair -->
  <path d="M 104,95 C 98,40 125,24 150,24 C 175,24 202,40 196,95 C 190,60 174,36 150,36 C 126,36 110,60 104,95 Z" fill="#2d1e18" />
  <circle cx="118" cy="48" r="14" fill="#2d1e18" />
  <circle cx="140" cy="34" r="15" fill="#2d1e18" />
  <circle cx="162" cy="34" r="15" fill="#2d1e18" />
  <circle cx="182" cy="48" r="14" fill="#2d1e18" />

  <!-- Eyebrows & Eyes -->
  <path d="M 124,90 Q 134,84 142,88 M 158,88 Q 166,84 176,90" stroke="#2d1e18" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="134" cy="97" r="4" fill="#1f1610" />
  <circle cx="166" cy="97" r="4" fill="#1f1610" />

  <!-- Smile & Nose -->
  <path d="M 150,95 L 147,110 L 153,110 Z" fill="#d4a373" opacity="0.8" />
  <path d="M 136,128 Q 150,136 164,128" stroke="#a3683b" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>